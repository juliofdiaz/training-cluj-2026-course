title: "bactflow QC report"
subtitle: "Reproducible Genomics course"
report_comment: >
  Generated by the bactflow teaching pipeline. Check the software_versions.tsv
  file in pipeline_info/ for the exact tool versions used.
# Keep only the sample ID (SA01.fastp.json -> SA01, SA01 in QUAST)
extra_fn_clean_exts:
  - ".fastp"
  - "_trimmed"
show_analysis_paths: false
# Show the read length in General Statistics
table_columns_visible:
  fastp:
    before_filtering_read1_mean_length: true
